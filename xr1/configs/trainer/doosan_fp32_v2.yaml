# @package _global_

trainer:
  accelerator: gpu
  precision: bf16-mixed
  num_nodes: 1
  strategy:
    type: ddp
    params:
      find_unused_parameters: true
  optimizer:
    type: torch.optim.AdamW
    params:
      lr: 1.0
      betas:
      - 0.9
      - 0.95
      weight_decay: 0.1
      eps: 1.0e-08
  scheduler:
    type: mibot.utils.cosine_warmup.get_cosine_schedule_with_warmup
    params:
      num_training_steps: 2000
      num_warmup_steps: 200
      warmup_lr_start: 5.0e-07
      max_lr: 2.0e-05
      min_lr: 5.0e-06
  seed: 42
  max_steps: 4
  save_interval: 2
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  project: demo
  exp_name: xr1_fp32_replay_continuous
  default_root_dir: /mnt/robotics_ssd/ktt_rc_robotics_thesis/xr1_fp32_stage11_exact_resume/run_20261028_165509_1022692/continuous/lightning
  ckpt_path: null
  profiler: null
  enable_progress_bar: false
  devices: 2
  fast_dev_run: false
  use_distributed_sampler: false
