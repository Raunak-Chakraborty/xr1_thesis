# @package _global_
# Provisional results configuration. All CLAIX qualification gates remain required.
defaults:
  - doosan_compact_fp32
  - _self_

production:
  max_length: 12288
  # Allocation deadlines/margins belong to the launcher mode, not this recipe.
  stop_after_step: null

model:
  params:
    source_commit: 52676ccfa3b52f05de51d3d7407f33855159ac95

data:
  params:
    max_steps: 48284
    train_datasets:
      batch_size: 24
      num_workers: 4
      prefetch_factor: 2
      persistent_workers: true
      in_order: true
      worker_timeout: 600
      # Process-local retention limits, not process RSS limits.
      json_cache_entries: 16
      json_cache_bytes: 268435456  # 256 MiB decoded Python objects
      zip_cache_entries: 32
      zip_cache_bytes: 134217728  # 128 MiB ZIP central-directory estimate
      zip_metadata_entries: 1024
      zip_metadata_bytes: 8388608  # 8 MiB validated identities
      # Explicit opt-in for the original frozen dataset. Keep manifest, episode
      # JSONs, ZIPs and sidecars externally immutable for every worker lifetime;
      # stop/restart workers before any update. Initial/reopen checks and CRCs
      # remain enabled. Use strict for two path stats on every handle hit.
      zip_integrity_policy: immutable
      cache_report_every: 0  # optional bounded trace summary every N lookups
      deterministic_replay: true

trainer:
  log_every_n_steps: 1
  devices: 1
  max_steps: 48284
  scheduler:
    params:
      num_training_steps: 48284
      num_warmup_steps: 500
  save_interval: 250
  exp_name: xr1_doosan_b24_results_v1
  default_root_dir: /hpcwork/zk443626/robotics_thesis/runs/xr1_results_finetune
  num_sanity_val_steps: 0
  enable_checkpointing: false
